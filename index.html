<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de candidatures</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e1e4e8;
    --text: #1f2328;
    --text-muted: #6a737d;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: var(--text-muted);
    margin-top: 0;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 1.1rem;
    margin-top: 0;
    margin-bottom: 16px;
  }
  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    align-items: end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field.full {
    grid-column: 1 / -1;
  }
  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  input, select, textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea {
    resize: vertical;
    min-height: 38px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
  }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 5px 10px;
    font-size: 0.8rem;
  }
  .btn-danger:hover {
    background: var(--danger);
    color: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
    vertical-align: top;
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:last-child td {
    border-bottom: none;
  }
  td.notes-cell {
    max-width: 240px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-muted);
  }
  .status-select {
    padding: 5px 8px;
    font-size: 0.82rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-weight: 600;
  }
  .status-a-postuler { background: #eef2ff; color: #4338ca; }
  .status-postule { background: #e0f2fe; color: #0369a1; }
  .status-entretien { background: #fef3c7; color: #92400e; }
  .status-refuse { background: #fee2e2; color: #b91c1c; }
  .status-offre { background: #dcfce7; color: #15803d; }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 0;
  }
  .table-wrap {
    overflow-x: auto;
  }
  .count-badge {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Suivi de candidatures</h1>
  <p class="subtitle">Ajoute et suis l'état de tes candidatures d'emploi. Les données sont sauvegardées localement dans ton navigateur.</p>

  <div class="card">
    <h2>Ajouter une candidature</h2>
    <form id="application-form">
      <div class="field">
        <label for="company">Entreprise</label>
        <input type="text" id="company" required placeholder="Ex: Acme Corp">
      </div>
      <div class="field">
        <label for="position">Poste</label>
        <input type="text" id="position" required placeholder="Ex: Développeur web">
      </div>
      <div class="field">
        <label for="status">Statut</label>
        <select id="status">
          <option value="a-postuler">À postuler</option>
          <option value="postule">Postulé</option>
          <option value="entretien">Entretien</option>
          <option value="refuse">Refusé</option>
          <option value="offre">Offre</option>
        </select>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
      <div class="field full">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Contact, lien de l'offre, suivi..."></textarea>
      </div>
      <div class="field">
        <button type="submit" class="btn-primary">Ajouter la candidature</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Mes candidatures <span class="count-badge" id="count-badge"></span></h2>
    <div class="table-wrap">
      <table id="applications-table">
        <thead>
          <tr>
            <th>Entreprise</th>
            <th>Poste</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="applications-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state">Aucune candidature pour le moment. Ajoute-en une ci-dessus.</div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'jobApplications';
  const STATUS_LABELS = {
    'a-postuler': 'À postuler',
    'postule': 'Postulé',
    'entretien': 'Entretien',
    'refuse': 'Refusé',
    'offre': 'Offre'
  };

  const form = document.getElementById('application-form');
  const tbody = document.getElementById('applications-body');
  const emptyState = document.getElementById('empty-state');
  const countBadge = document.getElementById('count-badge');

  function loadApplications() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveApplications(applications) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month, day] = dateStr.split('-');
    return `${day}/${month}/${year}`;
  }

  function render() {
    const applications = loadApplications();
    tbody.innerHTML = '';

    if (applications.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
    }

    countBadge.textContent = applications.length ? `(${applications.length})` : '';

    applications
      .slice()
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
      .forEach((app) => {
        const tr = document.createElement('tr');

        const statusOptions = Object.entries(STATUS_LABELS)
          .map(([value, label]) => `<option value="${value}" ${value === app.status ? 'selected' : ''}>${label}</option>`)
          .join('');

        tr.innerHTML = `
          <td>${escapeHtml(app.company)}</td>
          <td>${escapeHtml(app.position)}</td>
          <td>
            <select class="status-select status-${app.status}" data-id="${app.id}">
              ${statusOptions}
            </select>
          </td>
          <td>${formatDate(app.date)}</td>
          <td class="notes-cell">${escapeHtml(app.notes || '')}</td>
          <td><button class="btn-danger" data-id="${app.id}">Supprimer</button></td>
        `;
        tbody.appendChild(tr);
      });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const company = document.getElementById('company').value.trim();
    const position = document.getElementById('position').value.trim();
    const status = document.getElementById('status').value;
    const date = document.getElementById('date').value;
    const notes = document.getElementById('notes').value.trim();

    if (!company || !position) return;

    const applications = loadApplications();
    applications.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      company,
      position,
      status,
      date,
      notes
    });
    saveApplications(applications);
    form.reset();
    render();
  });

  tbody.addEventListener('change', (e) => {
    if (!e.target.classList.contains('status-select')) return;
    const id = e.target.dataset.id;
    const newStatus = e.target.value;
    const applications = loadApplications();
    const app = applications.find((a) => a.id === id);
    if (app) {
      app.status = newStatus;
      saveApplications(applications);
      render();
    }
  });

  tbody.addEventListener('click', (e) => {
    if (!e.target.classList.contains('btn-danger')) return;
    const id = e.target.dataset.id;
    if (!confirm('Supprimer cette candidature ?')) return;
    const applications = loadApplications().filter((a) => a.id !== id);
    saveApplications(applications);
    render();
  });

  render();
</script>
</body>
</html>
