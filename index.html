<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de candidatures</title>
<style>
  :root {
    --bg: #0a0c11;
    --card-bg: #141822;
    --card-bg-alt: #191e2a;
    --border: #262c3a;
    --border-soft: #1c212c;
    --text: #e9ebf1;
    --text-muted: #8992a6;
    --accent: #818cf8;
    --accent-hover: #6f78e8;
    --accent-soft: rgba(129, 140, 248, 0.14);
    --danger: #f87171;
    --danger-hover: #ef4444;
    --success: #34d399;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(129, 140, 248, 0.16), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(52, 211, 153, 0.08), transparent),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    padding: 32px 24px;
  }
  .container {
    max-width: 1080px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
    background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 70%, #7dd3fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 24px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px -12px rgba(0, 0, 0, 0.5);
  }
  .card h2 {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 18px;
  }
  .card h2::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px var(--accent-soft);
    flex-shrink: 0;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  input, select, textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    background: var(--card-bg-alt);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea {
    resize: vertical;
    min-height: 38px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  button:active {
    transform: scale(0.97);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6d78f5);
    color: #fff;
  }
  .btn-primary:hover {
    background: var(--accent-hover);
  }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(248, 113, 113, 0.4);
    padding: 5px 10px;
    font-size: 0.8rem;
  }
  .btn-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 12px 10px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 0.9rem;
    vertical-align: top;
  }
  th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:last-child td {
    border-bottom: none;
  }
  tbody tr:hover td {
    background: rgba(255, 255, 255, 0.015);
  }
  td.notes-cell {
    max-width: 420px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-muted);
  }
  .company-sector {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .status-select {
    padding: 5px 8px;
    font-size: 0.82rem;
    border-radius: 999px;
    border: 1px solid transparent;
    font-weight: 600;
  }
  .status-a-postuler { background: rgba(129, 140, 248, 0.16); color: #b4bdfc; }
  .status-postule { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
  .status-entretien { background: rgba(251, 191, 36, 0.18); color: #fbbf24; }
  .status-refuse { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
  .status-offre { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 0;
  }
  .table-wrap {
    overflow-x: auto;
  }
  .count-badge {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .btn-add {
    background: rgba(52, 211, 153, 0.12);
    color: #6ee7b7;
    border: 1px solid rgba(52, 211, 153, 0.35);
    padding: 5px 10px;
    font-size: 0.8rem;
  }
  .btn-add:hover {
    background: var(--success);
    border-color: var(--success);
    color: #0a0c11;
  }
  td.link-cell a {
    color: var(--accent);
    display: inline-block;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .actions-cell {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .filter-bar .field {
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .filter-bar label {
    white-space: nowrap;
  }
  .filter-bar select {
    width: auto;
  }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    cursor: pointer;
  }
  .checkbox-field input {
    width: auto;
    cursor: pointer;
  }
  .notes-input, .date-input {
    border: 1px solid transparent;
    background: transparent;
    font-family: inherit;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 6px;
    width: 100%;
  }
  .notes-input {
    resize: vertical;
    min-height: 36px;
    font-size: 0.85rem;
  }
  .date-input {
    font-size: 0.85rem;
    white-space: nowrap;
    color-scheme: dark;
  }
  .notes-input:hover, .date-input:hover {
    border-color: var(--border);
  }
  .notes-input:focus, .date-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--card-bg-alt);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .add-row td {
    background: rgba(129, 140, 248, 0.05);
  }
  .add-row .text-input {
    width: 100%;
    font-size: 0.85rem;
    padding: 6px 8px;
  }
  .btn-add-row {
    background: linear-gradient(135deg, var(--accent), #6d78f5);
    color: #fff;
    padding: 6px 12px;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .btn-add-row:hover {
    background: var(--accent-hover);
  }
  .file-cell {
    white-space: nowrap;
  }
  .file-attached {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-link {
    color: var(--accent);
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-remove-file {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    padding: 0 4px;
    cursor: pointer;
  }
  .btn-remove-file:hover {
    color: var(--danger);
  }
  .file-upload-label {
    display: inline-block;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .file-upload-label:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Suivi de candidatures</h1>

  <div class="card">
    <h2>Suggestions <span class="count-badge" id="suggestions-count-badge"></span></h2>
    <div class="table-wrap">
      <table id="suggestions-table">
        <thead>
          <tr>
            <th>Entreprise</th>
            <th>Poste</th>
            <th>Lien</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="suggestions-body"></tbody>
      </table>
      <div class="empty-state" id="suggestions-empty-state">Aucune suggestion pour le moment.</div>
    </div>
  </div>

  <div class="card">
    <h2>Mes candidatures <span class="count-badge" id="count-badge"></span></h2>
    <div class="filter-bar">
      <div class="field">
        <label for="status-filter">Filtrer par statut</label>
        <select id="status-filter">
          <option value="all">Tous les statuts</option>
          <option value="a-postuler">À postuler</option>
          <option value="postule">Postulé</option>
          <option value="entretien">Entretien</option>
          <option value="refuse">Refusé</option>
          <option value="offre">Offre</option>
        </select>
      </div>
      <label class="checkbox-field">
        <input type="checkbox" id="hide-rejected">
        Masquer les candidatures refusées
      </label>
    </div>
    <div class="table-wrap">
      <table id="applications-table">
        <thead>
          <tr>
            <th>Entreprise</th>
            <th>Poste</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Notes</th>
            <th>CV</th>
            <th>Lettre de motivation</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="applications-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state">Aucune candidature pour le moment. Ajoute-en une ci-dessus.</div>
    </div>
  </div>
</div>

      position: 'Senior Consultant Business Transformation - Financial Services',
      link: 'https://to.indeed.com/aa8pbbc668lq',
      notes: "Conseil en transformation business dans les services financiers (secteur accepté) chez un grand cabinet — bonne continuité avec un profil business/IT orienté institutions financières. 📍 Hors Bruxelles intramuros (Diegem)."
    },

    {

    {

      company: 'The Green Recruitment Company',
      sector: 'Cabinet de recrutement spécialisé énergies renouvelables',

      link: 'https://to.indeed.com/aavn4lnp6s6j',
      notes: "PM sur des solutions de stockage d'énergie hybrides (BESS/EMS) à Bruxelles. Secteur énergie/transition — à valider le niveau de technicité requis par rapport à un profil business/IT."
    },
    {
      key: 'turning-point-senior-project-manager-remote-uk-2026',
      company: 'Turning Point',
      sector: 'Association santé & social (UK)',
      position: 'Senior Project Manager (Portfolio & Transformation Delivery)',
      link: 'https://to.indeed.com/aanq7l7j6ldx',
      notes: "Poste remote basé au Royaume-Uni, chez une association de santé/social à impact positif. Pilotage de projets de transformation business/tech transverses, très proche de ton positionnement. ⚠️ Déplacements ponctuels au Royaume-Uni prévus (Londres, Manchester) — à valider la faisabilité depuis la Belgique (statut, fiscalité, visa)."
    }
  ];

  const STATUS_LABELS = {
    'a-postuler': 'À postuler',
    'postule': 'Postulé',
    'entretien': 'Entretien',
    'refuse': 'Refusé',
    'offre': 'Offre'
  };

  const tbody = document.getElementById('applications-body');
  const emptyState = document.getElementById('empty-state');
  const countBadge = document.getElementById('count-badge');
  const statusFilterSelect = document.getElementById('status-filter');
  const hideRejectedCheckbox = document.getElementById('hide-rejected');

  const suggestionsBody = document.getElementById('suggestions-body');
  const suggestionsEmptyState = document.getElementById('suggestions-empty-state');
  const suggestionsCountBadge = document.getElementById('suggestions-count-badge');

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  // Native date inputs can commit a value with a partially-typed year (e.g. "0002-09-10")
  // if the user tabs away before finishing all 4 digits. Treat those as not-yet-entered.
  function sanitizeDate(value) {
    if (!value) return '';
    const year = parseInt(value.slice(0, 4), 10);
    return year >= 1900 ? value : '';
  }

  function loadApplications() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveApplications(applications) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
    } catch (e) {
      alert("Stockage local plein : impossible de sauvegarder. Essaie de retirer d'anciens fichiers CV/lettres de motivation pour libérer de la place.");
    }
  }

  function loadFilters() {
    try {
      const raw = localStorage.getItem(FILTERS_KEY);
      return raw ? JSON.parse(raw) : { status: 'all', hideRejected: false };
    } catch (e) {
      return { status: 'all', hideRejected: false };
    }
  }

  function saveFilters(filters) {
    localStorage.setItem(FILTERS_KEY, JSON.stringify(filters));
  }

  function loadSuggestions() {
    try {
      const raw = localStorage.getItem(SUGGESTIONS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveSuggestions(suggestions) {
    localStorage.setItem(SUGGESTIONS_KEY, JSON.stringify(suggestions));
  }

  function seedAutoSuggestions() {
    let seen;
    try {
      seen = JSON.parse(localStorage.getItem(AUTO_SUGGESTIONS_SEEN_KEY) || '[]');
    } catch (e) {
      seen = [];
    }

    const suggestions = loadSuggestions();
    let changed = false;

    AUTO_SUGGESTIONS.forEach((item) => {
      if (seen.includes(item.key)) return;
      suggestions.push({
        id: generateId(),
        company: item.company,
        sector: item.sector,
        position: item.position,
        link: item.link,
        notes: item.notes
      });
      seen.push(item.key);
      changed = true;
    });

    if (changed) {
      saveSuggestions(suggestions);
      localStorage.setItem(AUTO_SUGGESTIONS_SEEN_KEY, JSON.stringify(seen));
    }
  }

  // Backfills fields (like "sector") added to AUTO_SUGGESTIONS after a suggestion was
  // already seeded, since seeding itself only ever runs once per key. Matches on link,
  // the most stable identifier for a curated entry.
  function migrateAutoSuggestions() {
    const suggestions = loadSuggestions();
    let changed = false;

    suggestions.forEach((sug) => {
      if (sug.sector || !sug.link) return;
      const match = AUTO_SUGGESTIONS.find((item) => item.link === sug.link);
      if (match && match.sector) {
        sug.sector = match.sector;
        changed = true;
      }
    });

    if (changed) {
      saveSuggestions(suggestions);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderFileCell(app, field) {
    const file = app[field];
    if (file && file.dataUrl) {
      return `
        <div class="file-attached">
          <a href="${file.dataUrl}" target="_blank" rel="noopener noreferrer" class="file-link" title="${escapeHtml(file.name)}">📎 ${escapeHtml(file.name)}</a>
          <button class="btn-remove-file" data-id="${app.id}" data-field="${field}" title="Retirer le fichier">✕</button>
        </div>
      `;
    }
    return `
      <label class="file-upload-label">
        + Ajouter
        <input type="file" class="file-input" data-id="${app.id}" data-field="${field}" accept=".pdf,.doc,.docx" hidden>
      </label>
    `;
  }

  function render() {
    const applications = loadApplications();
    const filters = loadFilters();

    let filtered = applications;
    if (filters.status !== 'all') {
      filtered = filtered.filter((a) => a.status === filters.status);
    }
    if (filters.hideRejected) {
      filtered = filtered.filter((a) => a.status !== 'refuse');
    }

    const addRowStatusOptions = Object.entries(STATUS_LABELS)
      .map(([value, label]) => `<option value="${value}" ${value === 'a-postuler' ? 'selected' : ''}>${label}</option>`)
      .join('');

    tbody.innerHTML = `
      <tr class="add-row">
        <td><input type="text" id="new-company" class="text-input" placeholder="Entreprise"></td>
        <td><input type="text" id="new-position" class="text-input" placeholder="Poste"></td>
        <td>
          <select id="new-status" class="status-select status-a-postuler">
            ${addRowStatusOptions}
          </select>
        </td>
        <td><input type="date" id="new-date" class="date-input"></td>
        <td><textarea id="new-notes" class="notes-input" rows="2" placeholder="Notes"></textarea></td>
        <td class="file-cell"></td>
        <td class="file-cell"></td>
        <td><button id="add-application-btn" class="btn-add-row">Ajouter</button></td>
      </tr>
    `;

    const hasApplications = applications.length > 0;
    const hasVisibleApplications = filtered.length > 0;
    emptyState.style.display = hasVisibleApplications ? 'none' : 'block';
    emptyState.textContent = hasApplications && !hasVisibleApplications
      ? "Aucune candidature ne correspond aux filtres."
      : "Aucune candidature pour le moment. Ajoute-en une ci-dessus.";

    countBadge.textContent = hasApplications
      ? (filtered.length === applications.length ? `(${applications.length})` : `(${filtered.length} sur ${applications.length})`)
      : '';

    filtered
      .slice()
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
      .forEach((app) => {
        const tr = document.createElement('tr');

        const statusOptions = Object.entries(STATUS_LABELS)
          .map(([value, label]) => `<option value="${value}" ${value === app.status ? 'selected' : ''}>${label}</option>`)
          .join('');

        tr.innerHTML = `
          <td>${escapeHtml(app.company)}</td>
          <td>${escapeHtml(app.position)}</td>
          <td>
            <select class="status-select status-${app.status}" data-id="${app.id}">
              ${statusOptions}
            </select>
          </td>
          <td><input type="date" class="date-input" data-id="${app.id}" value="${app.date || ''}"></td>
          <td class="notes-cell"><textarea class="notes-input" data-id="${app.id}" rows="2" placeholder="Ajouter une note...">${escapeHtml(app.notes || '')}</textarea></td>
          <td class="file-cell">${renderFileCell(app, 'cv')}</td>
          <td class="file-cell">${renderFileCell(app, 'coverLetter')}</td>
          <td><button class="btn-danger" data-id="${app.id}">Supprimer</button></td>
        `;
        tbody.appendChild(tr);
      });
  }

  function renderSuggestions() {
    const suggestions = loadSuggestions();
    suggestionsBody.innerHTML = '';

    suggestionsEmptyState.style.display = suggestions.length === 0 ? 'block' : 'none';
    suggestionsCountBadge.textContent = suggestions.length ? `(${suggestions.length})` : '';

    suggestions.forEach((sug) => {
      const tr = document.createElement('tr');
      const linkCell = sug.link
        ? `<a href="${escapeHtml(sug.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sug.link)}</a>`
        : '';

      const sectorLine = sug.sector ? `<div class="company-sector">${escapeHtml(sug.sector)}</div>` : '';

      tr.innerHTML = `
        <td>${escapeHtml(sug.company)}${sectorLine}</td>
        <td>${escapeHtml(sug.position)}</td>
        <td class="link-cell">${linkCell}</td>
        <td class="notes-cell">${escapeHtml(sug.notes || '')}</td>
        <td class="actions-cell">
          <button class="btn-add" data-id="${sug.id}">Ajouter au tracker</button>
          <button class="btn-danger" data-id="${sug.id}">Supprimer</button>
        </td>
      `;
      suggestionsBody.appendChild(tr);
    });
  }

  function addApplicationFromRow() {
    const companyInput = document.getElementById('new-company');
    const positionInput = document.getElementById('new-position');
    const company = companyInput.value.trim();
    const position = positionInput.value.trim();

    if (!company) {
      companyInput.focus();
      return;
    }
    if (!position) {
      positionInput.focus();
      return;
    }

    const status = document.getElementById('new-status').value;
    const date = sanitizeDate(document.getElementById('new-date').value);
    const notes = document.getElementById('new-notes').value.trim();

    const applications = loadApplications();
    applications.push({
      id: generateId(),
      company,
      position,
      status,
      date,
      notes
    });
    saveApplications(applications);
    render();
  }

  suggestionsBody.addEventListener('click', (e) => {
    const id = e.target.dataset.id;
    if (!id) return;

    if (e.target.classList.contains('btn-add')) {
      const suggestions = loadSuggestions();
      const suggestion = suggestions.find((s) => s.id === id);
      if (!suggestion) return;

      const applications = loadApplications();
      applications.push({
        id: generateId(),
        company: suggestion.company,
        position: suggestion.position,
        status: 'a-postuler',
        date: '',
        notes: suggestion.link
          ? [suggestion.notes, `Lien: ${suggestion.link}`].filter(Boolean).join('\n')
          : suggestion.notes || ''
      });
      saveApplications(applications);
      saveSuggestions(suggestions.filter((s) => s.id !== id));
      render();
      renderSuggestions();
      return;
    }

    if (e.target.classList.contains('btn-danger')) {
      if (!confirm('Supprimer cette suggestion ?')) return;
      const suggestions = loadSuggestions().filter((s) => s.id !== id);
      saveSuggestions(suggestions);
      renderSuggestions();
    }
  });

  tbody.addEventListener('change', (e) => {
    const id = e.target.dataset.id;
    if (!id) return;

    if (e.target.classList.contains('file-input')) {
      const field = e.target.dataset.field;
      const file = e.target.files[0];
      if (!file) return;

      const MAX_FILE_SIZE = 5 * 1024 * 1024;
      if (file.size > MAX_FILE_SIZE) {
        alert('Fichier trop volumineux (5 Mo max).');
        e.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const applications = loadApplications();
        const app = applications.find((a) => a.id === id);
        if (!app) return;
        app[field] = { name: file.name, dataUrl: reader.result };
        saveApplications(applications);
        render();
      };
      reader.readAsDataURL(file);
      return;
    }

    const applications = loadApplications();
    const app = applications.find((a) => a.id === id);
    if (!app) return;

    if (e.target.classList.contains('status-select')) {
      app.status = e.target.value;
    } else if (e.target.classList.contains('date-input')) {
      const sanitized = sanitizeDate(e.target.value);
      if (sanitized !== e.target.value) {
        render();
        return;
      }
      app.date = sanitized;
    } else if (e.target.classList.contains('notes-input')) {
      app.notes = e.target.value.trim();
    } else {
      return;
    }

    saveApplications(applications);
    render();
  });

  tbody.addEventListener('click', (e) => {
    if (e.target.id === 'add-application-btn') {
      addApplicationFromRow();
      return;
    }

    if (e.target.classList.contains('btn-remove-file')) {
      const id = e.target.dataset.id;
      const field = e.target.dataset.field;
      const applications = loadApplications();
      const app = applications.find((a) => a.id === id);
      if (!app) return;
      delete app[field];
      saveApplications(applications);
      render();
      return;
    }

    if (!e.target.classList.contains('btn-danger')) return;
    const id = e.target.dataset.id;
    if (!confirm('Supprimer cette candidature ?')) return;
    const applications = loadApplications().filter((a) => a.id !== id);
    saveApplications(applications);
    render();
  });

  tbody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id !== 'new-company' && e.target.id !== 'new-position') return;
    e.preventDefault();
    addApplicationFromRow();
  });

  statusFilterSelect.addEventListener('change', () => {
    const filters = loadFilters();
    filters.status = statusFilterSelect.value;
    saveFilters(filters);
    render();
  });

  hideRejectedCheckbox.addEventListener('change', () => {
    const filters = loadFilters();
    filters.hideRejected = hideRejectedCheckbox.checked;
    saveFilters(filters);
    render();
  });

  const initialFilters = loadFilters();
  statusFilterSelect.value = initialFilters.status;
  hideRejectedCheckbox.checked = initialFilters.hideRejected;

  seedAutoSuggestions();
  migrateAutoSuggestions();
  render();
  renderSuggestions();
</script>
</body>
</html>
